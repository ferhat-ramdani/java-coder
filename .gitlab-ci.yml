image: maven:3.9.9-amazoncorretto-23-debian

before_script:
  - apt-get update
  - apt-get install -y psmisc

stages:
  - build
  - test
  - package
  
build_job:
  stage: build
  script:
    - mvn compile

package_job:
  stage: package
  script:
    - mvn package

test_job:
  stage: test
  script:
    - mvn test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
